version: '3'

tasks:
  go:mod:tidy:
    summary: Runs `go mod tidy`
    internal: true
    run: once
    cmds:
      - go mod tidy

  # Wails generates typed Go-to-client bindings from the application-owned
  # services. TypeScript for typing/editor, JavaScript for the runtime.
  bindings:
    summary: Generates Wails bindings (TypeScript for typing, JS for runtime)
    run: once
    deps:
      - task: go:mod:tidy
    sources:
      - "**/*.go"
      - exclude: app/bindings/**/*
      - exclude: app/static/bindings/**/*
      - go.mod
      - go.sum
    generates:
      - app/bindings/**/*
      - app/static/bindings/**/*
    cmds:
      - wails3 generate bindings -d app/bindings -ts -i -b ./...
      - wails3 generate bindings -d app/static/bindings -b -noevents ./...

  generate:icons:
    summary: Generates Windows `.ico` and Mac `.icns` from an image
    run: once
    dir: build
    sources:
      - "appicon.png"
      - "appicon.icon"
    generates:
      - "darwin/icons.icns"
      - "windows/icon.ico"
    cmds:
      - wails3 generate icons -input appicon.png -macfilename darwin/icons.icns -windowsfilename windows/icon.ico -iconcomposerinput appicon.icon -macassetdir darwin

  update:build-assets:
    summary: Updates the build assets
    dir: build
    cmds:
      - wails3 update build-assets -name "{{.APP_NAME}}" -binaryname "{{.APP_NAME}}" -config config.yml -dir .
