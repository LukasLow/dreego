# Wails build configuration for the dreego example.
# When you change `info`, run `wails3 task common:update:build-assets`.
version: '3'

info:
  companyName: "dreego"
  productName: "Wails dreego"
  productIdentifier: "dev.dreego.wails-dreego"
  description: "A dreego frontend rendered in a native Wails v3 window"
  copyright: "(c) 2026, dreego"
  comments: "Built with Wails v3 and dreego"
  version: "0.1.0"

# Dev mode: no npm, no Vite, no frontend dev server. Reload is deterministic:
# rebuild and restart.
dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - bin
      - app/bindings
      - app/static/bindings
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
    git_ignore: true
  executes:
    - cmd: wails3 task common:bindings
      type: blocking
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task run
      type: primary
      exit_policy: shutdown

fileAssociations:

other:
  - name: My Other Data
