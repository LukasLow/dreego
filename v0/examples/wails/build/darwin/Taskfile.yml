version: '3'

includes:
  common: ../Taskfile.yml

vars:
  DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}'
  OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'

tasks:
  # Minimal macOS build/run for the example. The full Wails asset set (icons,
  # dmg, notarization, universal binaries) is regenerated with:
  #   wails3 update build-assets -name wails-dreego -binaryname wails-dreego -config build/config.yml -dir build

  build:
    summary: Builds the application (host macOS)
    deps:
      - task: common:go:mod:tidy
    cmds:
      - go build -tags production -trimpath -buildvcs=false -o "{{.OUTPUT}}" .
    env:
      CGO_ENABLED: 1

  run:
    summary: Builds and runs the application
    deps:
      - task: build
    cmds:
      - '"{{.OUTPUT}}"'

  package:
    summary: Creates a macOS .app bundle
    deps:
      - task: build
    cmds:
      - mkdir -p "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/MacOS"
      - mkdir -p "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Resources"
      - cp "{{.OUTPUT}}" "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/MacOS/{{.APP_NAME}}"
      - cp build/darwin/Info.plist "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Info.plist"
      - codesign --force --deep --sign - "{{.BIN_DIR}}/{{.APP_NAME}}.app" || true
