version: '3'

vars:
  APP_NAME: "wails-dreego"
  BIN_DIR: "bin"
  GOOS: '{{.GOOS | default OS}}'

includes:
  common: ./build/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

tasks:
  default:
    cmds:
      - task --list

  bindings:
    summary: Generates Wails bindings (TypeScript + runtime JavaScript)
    cmds:
      - task: common:bindings

  build:
    summary: Builds the application for the host OS
    cmds:
      - task: "{{.GOOS}}:build"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Runs the application in development mode (rebuild + restart)
    cmds:
      - wails3 dev -config ./build/config.yml
