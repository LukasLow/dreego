# dreego Demo-Landschaft — zwei VERSCHIEDENE Sites auf zwei Ports.
# docker compose up --build
#
#   fensterbank (public) → http://localhost:4000   öffentliche Website
#   portal               → http://localhost:4001   Anmeldung/Konto
#
# Die Sites verlinken sich gegenseitig über den urls-Helfer (absolute Adressen).
services:
  fensterbank:
    build:
      context: .
      args:
        CMD: ./v0/examples/fensterbank
    command: ["-port", "4000"]
    ports:
      - "4000:4000"
    environment:
      DREEGO_SESSION_SECRET: "compose-dev-secret-mindestens-32-zeichen-lang"
      PORTAL_URL: "http://localhost:4001"
    restart: unless-stopped

  portal:
    build:
      context: .
      args:
        CMD: ./v0/examples/portal
    command: ["-port", "4001"]
    ports:
      - "4001:4001"
    environment:
      DREEGO_SESSION_SECRET: "compose-andere-secret-mindestens-32-zeichen"
      FENSTERBANK_URL: "http://localhost:4000"
    restart: unless-stopped
